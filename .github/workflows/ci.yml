  build-packages:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Install GUI dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Build binary
        run: |
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o hexloader .
      - name: Install nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Prepare package files
        run: |
          mkdir -p pkg/usr/bin
          cp hexloader pkg/usr/bin/hexloader
          chmod +x pkg/usr/bin/hexloader

          mkdir -p pkg/usr/share/applications
          cat > pkg/usr/share/applications/hexloader.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Hex Loader
          Comment=GUI HEX uploader for Arduino
          Exec=hexloader
          Icon=hexloader
          Categories=Development;Electronics;
          Terminal=false
          EOF

          mkdir -p pkg/usr/share/icons/hicolor/256x256/apps
          cp internal/assets/hex-loader.png pkg/usr/share/icons/hicolor/256x256/apps/hexloader.png
      - name: Build DEB package
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          nfpm package -f nfpm-deb.yaml -p deb -t "dist/hex-loader_${VERSION}_amd64.deb"
      - name: Build RPM package
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          nfpm package -f nfpm-rpm.yaml -p rpm -t "dist/hex-loader-${VERSION}.x86_64.rpm"
      - name: Verify packages
        run: ls -la dist/
      - name: Upload packages to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
          overwrite: true